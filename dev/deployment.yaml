apiVersion: apps/v1
kind: Deployment
metadata:
  name: development-deployment
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: development-app
  template:
    metadata:
      labels:
        app: development-app
    spec:
      containers:
      - name: development-container
        image: us-central1-docker.pkg.dev/qwiklabs-gcp-02-36532bc8e7b0/my-repository/sample-app:v1.0
        ports:
        - containerPort: 8080
